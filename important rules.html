<html>
    <title>Flexbox Example</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            justify-content: center;
            align-items: center;
            background-color: lightgray;
            padding: 20px;
        }
        .card{
            width: 200px;
            padding: 20px;
            background-color: lightblue;
            border: 1px solid blue;
            text-align: center;
        }
        </style></head><body>
            <h1>ABC college Departments</h1>
            <div class="container">
                <div class="card">
                    <h2>CSE</h2>
                    <p>Computer Science</p>
                </div>
                <div class="card">
                    <h2>ECE</h2>
                    <p>Electronics and Communication</p>
                    </div>
                    <div class="card">
                    <h2>EEE</h2>
                    <p>Electrical Eng</p>
                
                </div>
            </div>
        </body>
