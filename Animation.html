<html>
    <head>
        <style>
            .box {
                width: 120;
                height: 120px;
                background-color: red;
                /* ANIMATION PROPERTIES */
                animation-name: movBox;
                animation-duration: 1s;
                animation-iteration-count: infinite;
            }
            @keyframes movBox {
                from{
                    transform: translate(200px);
                }
            to{
                transform: translate(800px);
            }
            }
        </style>
    </head>
    <body>
        <div class="box"></div>
    </body>
</html>
